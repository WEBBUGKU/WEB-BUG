<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">

<title>LOCKED BY DHYASZ</title>

<style>
html, body {
    margin:0;
    padding:0;
    width:100%;
    height:100%;
    overflow:hidden;
    font-family:Arial;
    color:white;
    user-select:none;
}

/* BG GLITCH */
.bg {
    position:fixed;
    inset:0;
    z-index:-1;
    animation:glitch 0.2s infinite;
}
@keyframes glitch {
    0%{background:black;}
    20%{background:red;}
    40%{background:blue;}
    60%{background:purple;}
    80%{background:yellow;}
    100%{background:black;}
}

/* CENTER */
.container {
    width:100%;
    height:100%;
    display:flex;
    justify-content:center;
    align-items:center;
    text-align:center;
}

input {
    padding:12px;
    width:80%;
    border:none;
    border-radius:8px;
    text-align:center;
}

button {
    margin-top:10px;
    padding:12px 20px;
    border:none;
    border-radius:8px;
    background:#00ffcc;
    color:black;
    font-weight:bold;
}

#error {
    color:red;
    display:none;
}
</style>
</head>

<body onclick="fs()">

<div class="bg"></div>

<div class="container" id="main">
    <div>
        <h1>🔒 LOCKED BY DHYASZ</h1>
        <p>Perangkat diblokir</p>

        <input type="password" id="pin" placeholder="Masukkan PIN">
        <br>
        <button onclick="unlock()">Buka</button>

        <p id="error">PIN salah!</p>
    </div>
</div>

<script>
const PIN = "040911";
let vibrateLoop;

// FULLSCREEN
function fs(){
    let el=document.documentElement;
    if(el.requestFullscreen) el.requestFullscreen();
}

window.onload=fs;

// GETAR 1 MENIT
function startVibrate(){
    const duration = 1000;

    vibrateLoop = setInterval(()=>{
        navigator.vibrate(duration);
    }, duration);

    // stop setelah 1 menit
    setTimeout(()=>{
        stopVibrate();
        startBlink();
    }, 60000);
}

function stopVibrate(){
    navigator.vibrate(0);
    clearInterval(vibrateLoop);
}

// EFEK KELUAR MASUK (BLINK)
function startBlink(){
    let body = document.body;
    let visible = true;

    let blink = setInterval(()=>{
        visible = !visible;
        body.style.display = visible ? "block" : "none";
    }, 200);

    // stop setelah 10 detik
    setTimeout(()=>{
        clearInterval(blink);
        body.style.display = "block";
    }, 10000);
}

// UNLOCK
function unlock(){
    let val=document.getElementById("pin").value;

    if(val===PIN){
        startVibrate();
        alert("SYSTEM ERROR ⚠");
    }else{
        document.getElementById("error").style.display="block";
        navigator.vibrate(300);
    }
}
</script>

</body>
</html>
